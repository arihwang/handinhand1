<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영단어 탐험대 · HAND in HAND 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F3FF; --card:#FFFFFF; --ink:#1E2A4A; --muted:#5C6A8C; --edge:#1E2A4A;
  --yellow:#FFD23F; --green:#3BCE8C; --coral:#FF6B6B; --purple:#8B7CF8; --sky:#4DB2FF; --soft:#F2F7FF; --skyc:#C4E8FF; --grass:#9BE08F;
  --ko:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --en:"Fredoka","Jua","Arial Rounded MT Bold",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#131C33;--card:#1F2B49;--ink:#F2F5FF;--muted:#A6B2D4;--edge:#070B18;--soft:#26345A;--skyc:#2B3F70;--grass:#2E6A4C}
}
:root[data-theme="dark"]{--bg:#131C33;--card:#1F2B49;--ink:#F2F5FF;--muted:#A6B2D4;--edge:#070B18;--soft:#26345A;--skyc:#2B3F70;--grass:#2E6A4C}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);-webkit-tap-highlight-color:transparent;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px dashed var(--sky);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1,h2,p{margin:0}
.chunk{background:var(--card);border:3px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--edge)}
.press{transition:transform .08s,box-shadow .08s}
.press:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}

/* home */
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.hero .logo{font-size:44px;width:68px;height:68px;display:grid;place-items:center;background:var(--yellow);border:3px solid var(--edge);border-radius:20px;box-shadow:4px 4px 0 var(--edge);transform:rotate(-6deg)}
.hero h1{font-size:30px;line-height:1.1}.hero{flex-wrap:wrap}.aud{margin-left:auto;padding:9px 13px;font-size:14px;font-weight:700;white-space:nowrap;text-decoration:none;color:var(--ink,#1E2A4A);background:var(--card);border:3px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--edge)}
.hero p{color:var(--muted);font-size:16px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-family:var(--en)}
.stat span{font-size:14px;color:var(--muted)}
.bar{height:14px;border:3px solid var(--edge);border-radius:99px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
section{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
h2{font-size:21px}
.link{color:var(--muted);font-size:15px;text-decoration:underline;padding:4px}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.unit{padding:9px 8px 8px;text-align:left;background:var(--soft);border:3px solid var(--edge);border-radius:14px;opacity:.55;position:relative}
.unit.on{background:var(--card);opacity:1;box-shadow:3px 3px 0 var(--edge)}
.unit.on::after{content:"✓";position:absolute;top:-9px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--green);border:3px solid var(--edge);display:grid;place-items:center;font-size:12px;color:#fff;font-family:var(--en);font-weight:700}
.unit .n{font-family:var(--en);font-weight:700;font-size:17px;white-space:nowrap}.unit .n.sl{font-size:14px;line-height:21px}
.unit .t{font-family:var(--en);font-size:12px;color:var(--muted);line-height:1.2;height:29px;overflow:hidden;margin:2px 0 6px}.unit .t.lg{font-size:10.5px;letter-spacing:-.2px}
.unit .mini{height:6px;border-radius:9px;background:var(--bg);overflow:hidden}
.unit .mini i{display:block;height:100%;background:var(--green)}
.hint{margin-top:10px;color:var(--muted);font-size:15px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{padding:16px 14px;text-align:left;border:3px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--edge);color:#1E2A4A}
.mode .ic{font-size:34px;display:block;margin-bottom:6px}
.mode b{font-size:21px;display:block}
.mode small{font-size:14px;opacity:.8}
.m-blink{background:var(--yellow)} .m-flash{background:var(--sky)} .m-quiz{background:var(--coral)} .m-spell{background:var(--green)}
.m-wrong{grid-column:1/-1;background:var(--purple);display:flex;align-items:center;gap:12px}
.m-wrong .ic{margin:0}
.foot{margin-top:28px;display:flex;justify-content:space-between;color:var(--muted);font-size:14px}

/* play screens */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none}
.top .bar{flex:1}
.count{font-family:var(--en);font-weight:600;font-size:16px;min-width:52px;text-align:right}
.stage{padding:22px 16px;text-align:center;min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;position:relative}
.emo{font-size:72px;line-height:1}
.en{font-family:var(--en);font-weight:700;font-size:clamp(34px,11vw,58px);line-height:1.05;word-break:normal;overflow-wrap:normal}
.ko{font-size:clamp(26px,8vw,40px);line-height:1.2}
.reveal{min-height:56px;transition:opacity .25s,transform .25s}
.reveal.hide{opacity:0;transform:translateY(8px)}
.tag{position:absolute;top:12px;left:14px;font-size:14px;color:var(--muted)}
.speak{position:absolute;top:10px;right:12px;width:46px;height:46px;font-size:22px;border-radius:50%;display:grid;place-items:center}
.ctrls{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:12px 16px;font-size:18px;min-width:56px}
.btn.big{flex:1;padding:16px;font-size:21px}
.btn.yes{background:var(--green);color:#1E2A4A} .btn.no{background:var(--coral);color:#1E2A4A} .btn.go{background:var(--yellow);color:#1E2A4A}
.pill{padding:10px 14px;font-size:16px}

/* flashcard */
.flip{perspective:1200px;cursor:pointer}
.inner{position:relative;height:340px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:var(--yellow);color:#1E2A4A}
.face.back .tag{color:#1E2A4A;opacity:.7}
.tap{font-size:15px;color:var(--muted);margin-top:4px}

/* quiz */
.opts{display:grid;gap:10px;margin-top:14px}
.opt{padding:15px 14px;font-size:22px;text-align:left;display:flex;gap:12px;align-items:center}
.opt .k{width:32px;height:32px;flex:none;border-radius:10px;border:3px solid var(--edge);display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:15px;background:var(--soft)}
.opt.enf{font-family:var(--en);font-weight:600}
.opt.right{background:var(--green);color:#1E2A4A}
.opt.bad{background:var(--coral);color:#1E2A4A}
.opt.dim{opacity:.5}
.listen{width:120px;height:120px;border-radius:50%;font-size:52px;background:var(--sky);display:grid;place-items:center}

/* spelling */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0}
.wd{display:flex;flex-wrap:nowrap;gap:5px}.slot{--s:min(40px,calc((min(100vw,560px) - 76px)/var(--n) - 5px));width:var(--s);height:calc(var(--s)*1.25);flex:none;border:3px solid var(--edge);border-radius:10px;display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:calc(var(--s)*.7);background:var(--soft)}
.slot.f{background:var(--card)}
.gap{width:14px}
.slots.ok .slot{background:var(--green);color:#1E2A4A}
.slots.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:18px}
.tile{width:52px;height:56px;font-family:var(--en);font-weight:700;font-size:28px;background:var(--yellow);color:#1E2A4A}
.tile.used{visibility:hidden}
.answer{color:var(--muted);font-size:17px}
.answer b{font-family:var(--en);color:var(--ink)}

/* list */
.list{display:grid;gap:9px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px}
.row .e{font-size:30px}
.row .w{flex:1}
.row .w b{font-family:var(--en);font-size:21px;display:block}
.row .w span{color:var(--muted);font-size:16px}
.row .u{font-family:var(--en);font-size:13px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;font-size:19px}

/* end */
.end{padding:34px 18px;text-align:center}
.end .emo{font-size:84px}
.end h2{font-size:30px;margin:10px 0 6px}
.end p{color:var(--muted);font-size:18px}

.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.fx span{position:absolute;top:-40px;font-size:30px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.plus{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--en);font-weight:700;font-size:34px;background:var(--yellow);color:#1E2A4A;border:3px solid var(--edge);border-radius:16px;padding:6px 16px;box-shadow:4px 4px 0 var(--edge);animation:pop .9s forwards;z-index:10;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:16px;z-index:11}
.emo svg,.e svg,.listen svg{width:1.15em;height:1.15em;vertical-align:middle}
.slot.ghost{color:var(--muted);opacity:.5}
.pat{letter-spacing:4px}
.m-mon{grid-column:1/-1;background:#FF9F43;display:flex;align-items:center;gap:14px}
.m-mon .ic{margin:0;font-size:42px}
.field{position:relative;height:250px;overflow:hidden;background:linear-gradient(180deg,var(--skyc) 0 64%,var(--grass) 64% 100%)}
.mon{position:absolute;left:50%;bottom:26px;width:150px;height:150px;transform:translateX(-50%);animation:bob 1.8s ease-in-out infinite}
.mon svg{width:100%;height:100%;display:block}
@keyframes bob{0%,100%{transform:translateX(-50%)}50%{transform:translate(-50%,-8px)}}
.mon.hit{animation:hit .45s}
@keyframes hit{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-62%) rotate(-10deg);filter:brightness(1.8)}60%{transform:translateX(-40%) rotate(8deg)}}
.mon.dodge{animation:dodge .6s}
@keyframes dodge{0%,100%{transform:translateX(-50%)}40%{transform:translateX(15%) rotate(12deg)}}
.mon.flee{animation:none;transition:transform .7s,opacity .7s;transform:translateX(160%);opacity:0}
.mon.suck{animation:none;transition:transform .45s,opacity .45s;transform:translate(-50%,50px) scale(.1);opacity:0}
.cap{position:absolute;left:50%;bottom:-50px;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:3px solid var(--edge);background:linear-gradient(180deg,var(--purple) 0 44%,var(--edge) 44% 56%,var(--yellow) 56%);opacity:0}
.cap.throw{animation:throw .55s ease-out forwards}
@keyframes throw{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(-150px) rotate(720deg) scale(.85)}}
.cap.sit{opacity:1;bottom:40px}
.cap.wob{animation:wob .5s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-22deg)}75%{transform:rotate(22deg)}}
.hp{position:absolute;top:10px;right:12px;font-size:18px;letter-spacing:2px}
.hp .off{filter:grayscale(1);opacity:.3}
.mtag{position:absolute;top:10px;left:12px;border:3px solid var(--edge);border-radius:99px;padding:2px 10px;font-size:14px;color:#1E2A4A}
.msg{position:absolute;left:50%;top:46px;transform:translateX(-50%);font-size:19px;white-space:nowrap;background:var(--card);border:3px solid var(--edge);border-radius:12px;padding:4px 12px;opacity:0;transition:opacity .2s}
.msg.on{opacity:1}
.caught{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:10px}
.caught .mon{position:static;transform:none;width:130px;height:130px;animation:popin .5s}
.caught b{font-size:24px}
.caught small{color:var(--muted);font-size:15px}
@keyframes popin{0%{transform:scale(.2)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.qbox{margin-top:12px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;justify-content:center}
.qbox .en{font-size:clamp(30px,9vw,44px)}
.qbox .ko{font-size:clamp(24px,7vw,34px)}
.qh{color:var(--muted);font-size:14px}
.listen.sm{width:64px;height:64px;font-size:28px}
.opts.g2{grid-template-columns:1fr 1fr}
.g2 .opt{justify-content:center;text-align:center;font-size:19px;min-height:62px;padding:10px}
.streak{padding:6px 12px;font-family:var(--en);font-weight:700;font-size:16px}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dx{padding:8px 6px 10px;text-align:center;position:relative}
.dx .mon{position:static;transform:none;animation:none;width:100%;height:auto;aspect-ratio:1}
.dx.no .mon{filter:brightness(0);opacity:.15}
.dx b{display:block;font-size:16px}
.dx small{color:var(--muted);font-size:12px}
.rd{position:absolute;top:8px;left:8px;width:12px;height:12px;border-radius:50%;border:2px solid var(--edge)}
.field3{position:relative;height:min(64vw,330px);min-height:250px;overflow:hidden;background:linear-gradient(180deg,var(--skyc) 0%,var(--bg) 100%)}
.field3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.field3 .mtag,.field3 .msg{z-index:3}
.mname{position:absolute;top:44px;left:12px;z-index:3;font-size:16px;background:var(--card);border:3px solid var(--edge);border-radius:10px;padding:1px 8px}
.lives{position:absolute;top:10px;right:12px;z-index:3;font-size:17px;letter-spacing:1px}
.lives .off{filter:grayscale(1);opacity:.3}
.gauge{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:5px;align-items:center;background:var(--card);border:3px solid var(--edge);border-radius:99px;padding:5px 10px}
.gauge span{width:13px;height:13px;border-radius:50%;border:2px solid var(--edge);background:var(--soft)}
.gauge span.on{background:var(--yellow)}
.gauge b{font-family:var(--en);font-size:14px;margin-left:4px}
.caught3{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:2px;animation:popin .4s}
.caught3 b{font-size:22px}.caught3 small{color:var(--muted);font-size:15px}
.dexsum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dexsum span{padding:5px 9px;font-size:13px;display:flex;align-items:center;gap:5px;border-radius:12px;box-shadow:2px 2px 0 var(--edge)}
.dexsum i{width:10px;height:10px;border-radius:50%;border:2px solid var(--edge)}
.dx img{width:100%;aspect-ratio:1;display:block;object-fit:contain}
.dx.no img{filter:brightness(0);opacity:.15}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation-duration:.01s!important}}
@media (max-width:360px){.units{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

  const top=new THREE.Mesh(new THREE.SphereGeometry(.3,24,12,0,Math.PI*2,0,Math.PI/2),tm(0x8B7CF8)),bot=new THREE.Mesh(new THREE.SphereGeometry(.3,24,12,0,Math.PI*2,Math.PI/2,Math.PI/2),tm(0xFFD23F));
  const band=new THREE.Mesh(new THREE.TorusGeometry(.3,.035,8,32),new THREE.MeshBasicMaterial({color:0x1E2A4A}));band.rotation.x=Math.PI/2;
  const btn=new THREE.Mesh(new THREE.SphereGeometry(.07,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));btn.position.z=.29;
  const o=new THREE.Mesh(new THREE.SphereGeometry(.32,20,12),new THREE.MeshBasicMaterial({color:0x1E2A4A,side:THREE.BackSide}));
  g.add(top,bot,band,btn,o);g.visible=false;g.userData.mats=[top.material,bot.material];return g}
function world(){
  if(R3)return R3;shared();
  const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(36,1,.1,100);cam.position.set(0,2.3,7.4);cam.lookAt(0,1.15,0);
  sc.add(new THREE.HemisphereLight(0xffffff,0x9fbf9f,.75));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,6,5);sc.add(dl);
  const tmat=c=>new THREE.MeshToonMaterial({color:c,gradientMap:GRAD}),OUT=new THREE.MeshBasicMaterial({color:0x1E2A4A,side:THREE.BackSide});
  const gg=new THREE.CylinderGeometry(2.4,2.6,.3,48),gr=new THREE.Mesh(gg,tmat(0x7FD36E));gr.position.y=-.15;const go=new THREE.Mesh(gg,OUT);go.scale.set(1.02,1.12,1.02);gr.add(go);sc.add(gr);
  const far=new THREE.Mesh(new THREE.CylinderGeometry(16,16,.2,48),tmat(0xA7E39A));far.position.set(0,-.45,-6);sc.add(far);
  [[-4.2,-4],[-2.8,-6],[3.2,-5],[4.6,-3.5],[1.2,-8]].forEach(([x,z],k)=>{const t=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,.6,8),tmat(0x9C6B43));tr.position.y=.1;const cn=new THREE.Mesh(new THREE.ConeGeometry(.6,1.4,10),tmat(k%2?0x2E9E5B:0x3BCE8C));cn.position.y=1;t.add(tr,cn);t.position.set(x,-.35,z);sc.add(t)});
  const clouds=[],cm=tmat(0xffffff);for(let k=0;k<3;k++){const c=new THREE.Group();[[0,0,.6],[.6,.1,.45],[-.6,0,.45]].forEach(([x,y,r])=>{const s=new THREE.Mesh(SPH,cm);s.position.set(x,y,0);s.scale.setScalar(r);c.add(s)});c.position.set(-6+k*5,4+k*.4,-9);sc.add(c);clouds.push(c)}
  const sh=new THREE.Mesh(new THREE.CircleGeometry(1,32),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.18}));sh.rotation.x=-Math.PI/2;sh.position.y=.005;sc.add(sh);
  const cap=makeCap();sc.add(cap);
  R3={ren,sc,cam,mon:null,sh,cap,clouds,tw:[],active:false,running:false};
  window.addEventListener("resize",fit3);
  return R3;
}
function fit3(){if(!R3||!R3.active)return;const el=R3.ren.domElement.parentNode;if(!el)return;const w=el.clientWidth,h=el.clientHeight;R3.ren.setSize(w,h,false);R3.cam.aspect=w/h;R3.cam.updateProjectionMatrix()}
function tw(d,f,end){if(R3)R3.tw.push({t0:performance.now(),d,f,end})}
const twP=(d,f)=>new Promise(r=>tw(d,f,r));
function loop(now){const W3=R3;if(!W3.active){W3.running=false;return}requestAnimationFrame(loop);
  const t=now/1000,list=W3.tw;W3.tw=[];
  list.forEach(x=>{const p=Math.min(1,(now-x.t0)/x.d);x.f(p);if(p<1)W3.tw.push(x);else if(x.end)x.end()});
  const m=W3.mon;
  if(m){const u=m.userData;
    if(u.idle){const b=Math.sin(t*3.2);u.B.position.y=u.by+Math.abs(b)*.1;u.B.scale.set(u.base*(1+b*.025),u.base*(1-b*.025),u.base*(1+b*.025));m.rotation.y=Math.sin(t*.9)*.35}
    const bl=(t%3.4)<.13;u.eyes.forEach(e=>e.scale.y=bl?.12:1);
    u.orbit.forEach((o,k)=>{const a=t*1.6+k*Math.PI*2/u.orbit.length;o.position.set(Math.cos(a)*1.4,1.2+Math.sin(t*2+k)*.4,Math.sin(a)*1.4);o.rotation.y=t*3});
    if(u.ring)u.ring.rotation.z=t*.8;
    W3.sh.visible=m.visible;W3.sh.scale.setScalar(Math.max(.01,m.scale.x)*1.1);W3.sh.position.x=m.position.x}
  W3.clouds.forEach((c,k)=>{c.position.x+=.003*(k+1);if(c.position.x>9)c.position.x=-9});
  W3.ren.render(W3.sc,W3.cam)}
function mount(el){const W3=world();el.prepend(W3.ren.domElement);W3.active=true;fit3();if(!W3.running){W3.running=true;requestAnimationFrame(loop)}}
function setMon(i){const W3=R3;if(W3.mon){W3.sc.remove(W3.mon);disposeMon(W3.mon)}const m=buildMon(i);m.scale.setScalar(.01);W3.sc.add(m);W3.mon=m;W3.cap.visible=false;
  tw(520,p=>m.scale.setScalar(p<.7?Math.max(.01,p/.7*1.15):1.15-(p-.7)/.3*.15))}
function burst(p,col,n){const W3=R3,g=new THREE.OctahedronGeometry(.08),mt=new THREE.MeshBasicMaterial({color:col}),ps=[];
  for(let k=0;k<(n||14);k++){const o=new THREE.Mesh(g,mt);o.position.copy(p);o.userData.v=new THREE.Vector3((Math.random()-.5)*3,Math.random()*2.5+.5,(Math.random()-.5)*2);W3.sc.add(o);ps.push(o)}
  tw(750,q=>ps.forEach(o=>{o.position.addScaledVector(o.userData.v,.016);o.userData.v.y-=.06;o.scale.setScalar(Math.max(.01,1-q));o.rotation.y+=.2}),()=>{ps.forEach(o=>W3.sc.remove(o));g.dispose();mt.dispose()})}
const FROM=()=>new THREE.Vector3(0,1.15,4.8);
function throw3d(done){const c=R3.cap,m=R3.mon,to=new THREE.Vector3(m.position.x,1.2,.7),from=FROM();c.visible=true;c.rotation.set(0,0,0);
  tw(520,p=>{c.position.lerpVectors(from,to,p);c.position.y+=Math.sin(Math.PI*p)*1.1;c.rotation.x=-p*12},()=>{c.visible=false;burst(to,0xFFD23F);hitFx();done()})}
function hitFx(){const m=R3.mon;tw(380,p=>{setFlash(m,(1-p)*.7);m.rotation.x=-Math.sin(Math.PI*p)*.3;m.position.z=-Math.sin(Math.PI*p)*.4},()=>{setFlash(m,0);m.rotation.x=0;m.position.z=0})}
function throwMiss(){const c=R3.cap,m=R3.mon,from=FROM(),mid=new THREE.Vector3(0,1.2,.7),to=new THREE.Vector3(0,.2,-3),d=Math.random()<.5?-1:1;c.visible=true;
  tw(620,p=>{m.position.x=d*Math.sin(Math.PI*p)*1.4;m.position.y=Math.sin(Math.PI*p)*.5},()=>{m.position.x=0;m.position.y=0});
  tw(800,p=>{if(p<.6){const q=p/.6;c.position.lerpVectors(from,mid,q);c.position.y+=Math.sin(Math.PI*q)*1.1}else c.position.lerpVectors(mid,to,(p-.6)/.4);c.rotation.x=-p*14},()=>{c.visible=false})}
function flee3d(){const m=R3.mon,d=Math.random()<.5?-1:1;m.userData.idle=false;m.rotation.y=d*Math.PI/2;return twP(900,p=>{m.position.x=d*p*6;m.position.y=Math.abs(Math.sin(p*Math.PI*4))*.5})}
async function capture3d(){const m=R3.mon,c=R3.cap;m.userData.idle=false;c.position.set(m.position.x,1.2,.7);c.visible=true;c.rotation.set(0,0,0);
  await twP(500,p=>{m.scale.setScalar(Math.max(.01,1-p));setFlash(m,p*.9);c.rotation.y=p*6});m.visible=false;
  await twP(420,p=>{c.position.y=1.2-.9*p*p});
  await twP(280,p=>{c.position.y=.3+Math.sin(Math.PI*p)*.22});
  for(let k=0;k<3;k++){await twP(260,()=>{});await twP(460,p=>{c.rotation.z=Math.sin(Math.PI*2*p)*.45})}
  await twP(200,()=>{});burst(c.position.clone().add(new THREE.Vector3(0,.3,0)),0xFFD23F,22);
  await twP(420,p=>c.userData.mats.forEach(mm=>mm.emissive.setScalar(Math.sin(Math.PI*p)*.6)))}

let M,msgT=null;
function hunt(){if(!has3D())return toast("3D 화면을 불러오지 못했어요. 인터넷 연결을 확인해 주세요");const ids=pool("sel");if(!ids.length)return toast("단원을 먼저 골라 주세요");M={ids,streak:0,last:null};newMon()}
function pickMon(){const roll=Math.random()+Math.min(M.streak,10)*.015,tier=roll>.93?2:roll>.65?1:0;const cand=[...Array(MON_N).keys()].filter(i=>rarityOf(i)===tier),un=cand.filter(i=>!S.dex[i]);const list=un.length&&Math.random()<.7?un:cand;return list[Math.floor(Math.random()*list.length)]}
function newMon(){const i=pickMon(),r=rarityOf(i);Object.assign(M,{mon:i,need:NEED[r],hits:0,miss:0,state:"fight"});drawBattle();setMon(i);showMsg(r===2?"✨ 전설의 몬스터가 나타났다!":r===1?"희귀한 몬스터가 나타났다!":"야생 몬스터가 나타났다!",1600);newQ(true)}
function drawBattle(){const i=M.mon,r=rarityOf(i);
  app.innerHTML=`<div class="top"><button class="x chunk press" data-a="home" aria-label="처음으로">✕</button><h2 style="flex:1">몬스터 잡기</h2><span class="streak chunk" id="stk">🔥 ${M.streak}</span></div>
  <div class="field3 chunk" id="field"><div class="mtag" style="background:${RC[r]}">Lv.${r+1} ${RN[r]}</div><div class="mname">${S.dex[i]?monName(i):"???"}</div><div class="lives" id="lives"></div><div class="gauge" id="gauge"></div><div class="msg" id="msg"></div></div>
  <div id="qarea"></div>`;mount($("#field"));updHud()}
function updHud(){const g=$("#gauge"),l=$("#lives"),s=$("#stk");
  if(g)g.innerHTML=Array.from({length:M.need},(_,k)=>`<span class="${k<M.hits?"on":""}"></span>`).join("")+`<b>${M.hits}/${M.need}</b>`;
  if(l)l.innerHTML=Array.from({length:MISS_MAX},(_,k)=>`<span class="${k<MISS_MAX-M.miss?"":"off"}">❤️</span>`).join("");
  if(s)s.textContent="🔥 "+M.streak}
function showMsg(t,ms){const m=$("#msg");if(!m)return;m.textContent=t;m.classList.add("on");clearTimeout(msgT);msgT=setTimeout(()=>m.classList.remove("on"),ms||1300)}
function newQ(first){let id;do{id=M.ids[Math.floor(Math.random()*M.ids.length)]}while(M.ids.length>1&&id===M.last);M.last=id;
  const t=["ek","ke","listen"][Math.floor(Math.random()*3)];M.q={id,t,opts:makeOpts(id,t==="ek"?"ko":"en")};M.ans=null;drawQ3(true)}
function drawQ3(speak){const q=M.q,w=W[q.id],field=q.t==="ek"?"ko":"en",qa=$("#qarea");if(!qa)return;
  const prompt=q.t==="ek"?`<div class="en">${w.en}</div><div class="qh">뜻을 골라 캡슐을 던져요!</div>`:q.t==="ke"?`<div class="ko">${w.ko}</div><div class="qh">영어 단어를 골라 캡슐을 던져요!</div>`:`<button class="listen sm chunk press" data-a="sayM" aria-label="다시 듣기">🔊</button><div class="qh">듣고 골라 캡슐을 던져요!</div>`;
  qa.innerHTML=`<div class="qbox chunk">${prompt}</div><div class="opts g2">${q.opts.map((o,k)=>`<button class="opt chunk press ${field==="en"?"enf":""}" data-a="mAns" data-v="${k}">${W[o][field]}</button>`).join("")}</div>`;
  if(speak&&q.t!=="ke")say(w.en)}
function mAns(v){if(!M||M.ans!==null||M.state!=="fight")return;M.ans=+v;const q=M.q,ok=q.opts[M.ans]===q.id;
  app.querySelectorAll(".opts .opt").forEach((b,j)=>{b.disabled=true;b.classList.add(q.opts[j]===q.id?"right":j===M.ans?"bad":"dim")});say(W[q.id].en);
  if(ok){up(q.id);M.streak++;M.hits++;updHud();
    if(M.hits>=M.need){M.state="catch";throw3d(()=>{showMsg("잡아라!",1200);capture3d().then(caught)})}
    else throw3d(()=>{showMsg(M.streak>=3?`${M.streak}연속 명중! 🔥`:"명중! 💥");T=setTimeout(newQ,800)})}
  else{miss(q.id);M.streak=0;M.miss++;updHud();throwMiss();
    if(M.miss>=MISS_MAX){M.state="flee";showMsg("앗, 도망가요! 💨",1500);T=setTimeout(()=>flee3d().then(fled),1000)}
    else{showMsg(`피했어요! 기회 ${MISS_MAX-M.miss}번 남았어요`,1500);T=setTimeout(newQ,1700)}}}
function afterBtns(){const qa=$("#qarea");if(qa)qa.innerHTML=`<div class="ctrls"><button class="btn big chunk press go" data-a="mNext">다음 몬스터 찾기</button><button class="btn big chunk press" data-a="dex">📖 도감</button></div>`}
function caught(){if(!$("#field"))return;const i=M.mon,r=rarityOf(i),isNew=!S.dex[i];S.dex[i]=(S.dex[i]||0)+1;save();star([1,3,5][r]);party();
  const m=R3.mon;R3.cap.visible=false;m.visible=true;setFlash(m,0);m.userData.idle=true;tw(500,p=>m.scale.setScalar(Math.max(.01,p)));
  $(".mname").textContent=monName(i);
  $("#field").insertAdjacentHTML("beforeend",`<div class="caught3"><b>${monName(i)}, 잡았다!</b><small>${isNew?"🆕 새 몬스터! 도감에 등록됐어요":`벌써 ${S.dex[i]}마리째예요`}</small></div>`);afterBtns()}
function fled(){if(!$("#field"))return;$("#field").insertAdjacentHTML("beforeend",`<div class="caught3"><b>💨 몬스터가 도망갔어요</b><small>다음엔 꼭 잡아요!</small></div>`);afterBtns()}

const THUMB={};let TR=null;
function thumbR(){if(TR)return TR;shared();const ren=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});ren.setPixelRatio(1);ren.setSize(180,180);const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x9fbf9f,.8));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,6,5);sc.add(dl);const cam=new THREE.PerspectiveCamera(30,1,.1,50);cam.position.set(0,1.8,7.2);cam.lookAt(0,1.2,0);TR={ren,sc,cam};return TR}
function thumb(i){if(THUMB[i])return THUMB[i];const r=thumbR(),m=buildMon(i);m.rotation.y=-.4;r.sc.add(m);r.ren.render(r.sc,r.cam);THUMB[i]=r.ren.domElement.toDataURL("image/png");r.sc.remove(m);disposeMon(m);return THUMB[i]}
function dex(){const ids=[...Array(MON_N).keys()],n=ids.filter(i=>S.dex[i]).length,tot=[60,30,10],cnt=[0,1,2].map(r=>ids.filter(i=>rarityOf(i)===r&&S.dex[i]).length);
  app.innerHTML=`<div class="top"><button class="x chunk press" data-a="home" aria-label="처음으로">✕</button><h2 style="flex:1">몬스터 도감</h2><span class="count">${n}/${MON_N}</span></div>
  <div class="bar" style="margin-bottom:10px"><i style="width:${n/MON_N*100}%"></i></div>
  <div class="dexsum">${[0,1,2].map(r=>`<span class="chunk"><i style="background:${RC[r]}"></i>Lv.${r+1} ${RN[r]} ${cnt[r]}/${tot[r]}</span>`).join("")}</div>
  <div class="dex">${ids.map(i=>{const c=S.dex[i],r=rarityOf(i);return `<div class="dx chunk ${c?"":"no"}"><span class="rd" style="background:${RC[r]}"></span><img id="th${i}" alt="" ${THUMB[i]?`src="${THUMB[i]}"`:""}><b>${c?monName(i):"No."+String(i+1).padStart(3,"0")}</b><small>Lv.${r+1}${c>1?" ×"+c:""}</small></div>`}).join("")}</div>
  <div class="ctrls"><button class="btn big chunk press go" data-a="hunt">👾 잡으러 가기</button></div>`;
  if(has3D())fillThumbs()}
function fillThumbs(){const todo=[...Array(MON_N).keys()].filter(i=>!THUMB[i]);let k=0;(function step(){if(!document.getElementById("th0"))return;for(let c=0;c<3&&k<todo.length;c++,k++){const i=todo[k],u=thumb(i),im=document.getElementById("th"+i);if(im)im.src=u}if(k<todo.length)requestAnimationFrame(step)})()}

/* ---------- ACTIONS ---------- */
const A={
  home:()=>go(home),
  unit:v=>{v=+v;S.sel=S.sel.includes(v)?S.sel.filter(x=>x!==v):[...S.sel,v].sort((a,b)=>a-b);save();home()},
  all:()=>{S.sel=S.sel.length===ALLU.length?[]:ALLU.slice();save();home()},
  sound:()=>{S.sound=!S.sound;save();home()},
  reset:()=>{if(confirm("별, 익힌 단어, 오답 기록을 모두 지울까요?")){S.stars=0;S.lv={};S.wrong=[];save();home()}},
  blink:v=>go(blink,v||"sel"),flash:v=>go(flash,v||"sel"),quiz:v=>go(quiz,v||"sel"),spell:v=>go(spell,v||"sel"),wrongList:()=>go(wrongList),
  sayB:()=>say(W[B.ids[B.i]].en),
  bPlay:()=>{B.play=!B.play;tickB()},
  bPrev:()=>{B.i=Math.max(0,B.i-1);B.ph=0;tickB()},
  bNext:()=>{B.i=Math.min(B.ids.length-1,B.i+1);B.ph=0;tickB()},
  bSpeed:()=>{S.speed=(S.speed+1)%3;save();tickB()},
  bDir:()=>{S.dir=S.dir==="ek"?"ke":"ek";save();B.ph=0;tickB()},
  fFlip:()=>{F.flip=!F.flip;drawF(false)},
  sayF:(v,el,e)=>{e.stopPropagation();say(W[F.q[0]].en)},
  fYes:()=>{const id=F.q.shift();if(!F.seen.has(id))F.known++;up(id);F.flip=false;drawF(true)},
  fNo:()=>{const id=F.q.shift();F.seen.add(id);miss(id);F.q.splice(Math.min(3,F.q.length),0,id);F.flip=false;drawF(true)},
  sayQ:()=>say(W[Q.items[Q.i].id].en),
  qAns:v=>{if(Q.ans!==null)return;const it=Q.items[Q.i];Q.ans=+v;if(it.opts[Q.ans]===it.id){Q.score++;up(it.id);star(1)}else miss(it.id);drawQ(false);say(W[it.id].en)},
  qNext:()=>{Q.i++;Q.ans=null;if(Q.i>=Q.items.length){const s=Q.score,n=Q.items.length;return endScr(s===n?"🏆":s>=n*.7?"🎯":"💪",s===n?"만점이에요!":s>=n*.7?"아주 잘했어요!":"조금만 더 힘내요!",`${n}문제 중 ${s}개 맞혔어요`,"quiz",Q.src)}drawQ(true)},
  sayP:()=>say(W[P.ids[P.i]].en),
  pTile:v=>{v=+v;if(P.lock||P.typed.includes(v))return;P.typed.push(v);drawP();if(P.typed.length===P.L.length)checkP()},
  pBack:()=>{if(P.lock)return;P.typed.pop();drawP()},
  pSkip:()=>{stop();miss(P.ids[P.i]);nextP()},
  sayId:v=>say(W[v].en),
  hunt:()=>go(hunt),dex:()=>go(dex),mNext:()=>go(newMon),
  mAns:v=>mAns(v),sayM:()=>say(W[M.q.id].en)
};
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.v,b,e)});
document.addEventListener("keydown",e=>{
  if(Q&&app.querySelector("[data-a=qAns]")&&/^[1-4]$/.test(e.key))A.qAns(+e.key-1);
  if(e.key===" "&&app.querySelector(".flip")){e.preventDefault();A.fFlip()}
});
(function boot(){let has=false;try{has=!!localStorage.getItem(KEY)}catch(e){}
  if(has){home();return}
  idbGet().then(j=>{if(j){try{S=Object.assign(S,JSON.parse(j));try{localStorage.setItem(KEY,j)}catch(e){}}catch(e){}}home()});
})();
</script>
